<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none';">
  <title>چرخ و فلک</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <img class="brand-icon" src="assets/charkh-o-falak-symbol.svg" width="44" height="44" alt="نماد چرخ و فلک">
        <div class="brand-labels">
          <strong>چرخ و فلک</strong>
          <span lang="en" dir="ltr">CHARKH O FALAK</span>
        </div>
      </div>
      <span class="version" dir="ltr">1.1.0 <span class="version-mark">●</span></span>
    </header>

    <section class="intro" aria-labelledby="heading">
      <div class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span> آزاد، ساده، برای همه</div>
      <div class="hero-grid">
        <div class="hero-copy">
          <h1 id="heading">دروازه‌ای ساده<br>به <span>Google Flow</span></h1>
          <p class="intro-subtitle">ابزار کم‌حجم و رایگان برای مرورگر Chrome</p>
        </div>
        <div class="hero-art" aria-hidden="true">
          <span class="hero-circle"></span>
          <img src="assets/charkh-o-falak-symbol.svg" width="74" height="74" alt="">
          <span class="hero-mini hero-mini-a"></span>
          <span class="hero-mini hero-mini-b"></span>
        </div>
      </div>
    </section>

    <section class="control-card" aria-label="کنترل افزونه">
      <div class="control-main">
        <div class="control-copy">
          <span class="small-label">کنترل افزونه</span>
          <strong id="powerLabel">در حال بررسی…</strong>
        </div>
        <button id="toggle" class="power-toggle" type="button" role="switch" aria-label="روشن یا خاموش کردن افزونه" aria-checked="false" disabled>
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </button>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">
        <span class="status-dot status-dot--idle"></span>
        <span class="status-text">در حال بررسی وضعیت موتور…</span>
      </div>
    </section>

    <div class="actions">
      <button id="open" class="button button-primary" type="button">
        <span>باز کردن Google Flow</span>
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="reload" class="button button-secondary" type="button" hidden>بارگذاری دوباره تب Flow</button>
    </div>

    <p id="error" class="error" role="alert"></p>
    <p class="footnote">پس از تغییر وضعیت، تب Flow را دوباره بارگذاری کنید.</p>

    <footer class="footer">
      <a class="telegram" href="https://t.me/charrkhofalak" target="_blank" rel="noopener noreferrer" aria-label="کانال رسمی چرخ و فلک در تلگرام">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M21.4 3.1 2.9 10.3c-1.1.4-1.1 1.1-.2 1.4l4.7 1.5 1.8 5.6c.2.7.1.9.9.9.6 0 .9-.3 1.2-.6l2.3-2.2 4.8 3.6c.9.5 1.5.3 1.7-.9L23.2 4c.3-1.4-.5-1.9-1.8-.9ZM8.1 12.9l10.9-6.8c.5-.3 1-.1.6.3l-9 8.1-.3 3.3-2.2-4.9Z"/></svg>
        <span>کانال رسمی چرخ و فلک</span>
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <span class="footer-caption" dir="ltr">FREE / OPEN SOURCE</span>
    </footer>
  </main>
  <script src="panel.js"></script>
</body>
</html>
